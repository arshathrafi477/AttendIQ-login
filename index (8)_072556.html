<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AttendIQ — Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* ── TOKENS ── */
:root {
  --navy:      #1a237e;
  --navy2:     #283593;
  --saffron:   #e87722;
  --saffron-d: #c9621a;
  --ink:       #0d0d0f;
  --ink2:      #3d3d42;
  --ink3:      #7a7a82;
  --green:     #16a34a;
  --red:       #dc2626;
  --cream:     #f0ede8;
  --border:    #e0ddd8;
  --input-h:   50px;
  --r:         12px;
  --ease:      cubic-bezier(.22,1,.36,1);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html { -webkit-text-size-adjust:100%; }

body {
  font-family:'Outfit',sans-serif;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:24px 16px;
  background:
    radial-gradient(ellipse at 20% 80%, rgba(57,73,171,.6) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 20%, rgba(26,35,126,.5) 0%, transparent 55%),
    linear-gradient(135deg,#1a237e 0%,#283593 50%,#3949ab 100%);
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
}

.card {
  background:#fff;
  border-radius:20px;
  box-shadow:0 32px 80px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.06);
  width:100%; max-width:440px;
  position:relative; overflow:hidden;
  animation:slideUp .35s var(--ease) both;
}
@keyframes slideUp { from{opacity:0;transform:translateY(24px);} to{opacity:1;transform:translateY(0);} }

.panel { padding:28px 26px 30px; }

.auth-header { text-align:center; padding-bottom:18px; margin-bottom:18px; border-bottom:1px solid var(--border); }
.auth-icon { font-size:2.2rem; display:block; margin-bottom:8px; }
.auth-title { font-family:'Fraunces',serif; font-size:1.6rem; font-weight:700; color:var(--navy); letter-spacing:-.02em; margin-bottom:3px; }
.auth-subtitle { font-size:.9rem; color:var(--ink2); font-weight:500; margin-bottom:2px; }
.auth-hint { font-size:.78rem; color:var(--ink3); }

.form-error {
  background:rgba(220,38,38,.07); color:var(--red);
  border:1px solid rgba(220,38,38,.18);
  border-radius:10px; padding:9px 13px;
  font-size:.83rem; font-weight:500;
  margin-bottom:14px; line-height:1.45;
}
.form-error:empty { display:none; }

.field { margin-bottom:14px; }
.field-label { display:block; font-size:.82rem; font-weight:600; color:var(--ink2); margin-bottom:6px; }
.field-wrap { position:relative; display:flex; align-items:center; }
.field-icon { position:absolute; left:14px; display:flex; align-items:center; justify-content:center; color:var(--ink3); pointer-events:none; width:16px; }
.field-input {
  width:100%; height:var(--input-h);
  padding:0 14px 0 40px;
  border:1.5px solid var(--border);
  border-radius:var(--r);
  font-family:'Outfit',sans-serif; font-size:.95rem;
  color:var(--ink); background:#fafafa;
  outline:none; -webkit-appearance:none;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.field-input::placeholder { color:#b8b8c0; }
.field-input:focus { border-color:var(--navy2); background:#fff; box-shadow:0 0 0 3px rgba(40,53,147,.1); }
.field-input.is-valid   { border-color:var(--green); }
.field-input.is-invalid { border-color:var(--red); }

.otp-input {
  text-align:center; letter-spacing:10px;
  font-family:'JetBrains Mono',monospace;
  font-size:1.4rem; font-weight:700;
  padding-left:14px;
}

.field-msg { font-size:.76rem; margin-top:5px; min-height:15px; font-weight:600; display:flex; align-items:center; gap:5px; }
.field-msg.ok  { color:var(--green); }
.field-msg.bad { color:var(--red); }
.field-msg:empty { min-height:0; margin-top:0; }

.btn {
  width:100%; padding:14px; border-radius:var(--r);
  border:none; font-family:'Outfit',sans-serif;
  font-size:.95rem; font-weight:700; cursor:pointer;
  transition:all .15s; display:flex; align-items:center;
  justify-content:center; gap:8px; position:relative; overflow:hidden;
}
.btn:active:not(:disabled) { transform:scale(.98); }
.btn:disabled { opacity:.55; cursor:not-allowed; }
.btn-primary { background:var(--saffron); color:#fff; box-shadow:0 4px 16px rgba(232,119,34,.35); margin-top:6px; }
.btn-primary:hover:not(:disabled) { background:var(--saffron-d); box-shadow:0 6px 20px rgba(232,119,34,.45); }
.btn-secondary { background:var(--cream); color:var(--navy2); margin-top:10px; }
.btn-secondary:hover:not(:disabled) { background:#e6e2da; }

.spinner {
  width:16px; height:16px; border-radius:50%;
  border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff;
  animation:spin .65s linear infinite; display:none; flex-shrink:0;
}
.btn.loading .btn-txt { opacity:0; }
.btn.loading .spinner { display:block; position:absolute; }
@keyframes spin { to { transform:rotate(360deg); } }

.otp-timer {
  text-align:center; margin-top:12px;
  color:var(--ink3); font-size:.78rem; font-weight:500;
}
.otp-timer.warn    { color:var(--saffron-d); font-weight:700; }
.otp-timer.expired { color:var(--red); font-weight:700; }

.hidden { display:none !important; }

.link-row { text-align:center; margin-top:16px; font-size:.82rem; color:var(--ink3); }
.link-row a { color:var(--navy2); font-weight:600; text-decoration:none; }
.link-row a:hover { text-decoration:underline; }

#toasts {
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
  z-index:9999; display:flex; flex-direction:column; align-items:center; gap:8px;
  pointer-events:none; min-width:200px;
}
.toast {
  padding:11px 20px; border-radius:12px;
  font-size:.875rem; font-weight:500;
  box-shadow:0 8px 28px rgba(0,0,0,.22);
  animation:toastIn .3s cubic-bezier(.22,1,.36,1) both;
  pointer-events:all; max-width:320px; text-align:center; color:#fff;
}
.toast.success { background:rgba(22,163,74,.96); }
.toast.err     { background:rgba(220,38,38,.96); }
.toast.out     { animation:toastOut .3s ease forwards; }
@keyframes toastIn  { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
@keyframes toastOut { from{opacity:1} to{opacity:0;transform:translateY(8px)} }

@media (max-width:400px) {
  body { padding:16px 10px; }
  .panel { padding:22px 18px 26px; }
}
</style>
</head>
<body>

<div class="card">
  <div class="panel">

    <!-- ══════════════════════════════════
         STEP 1 — EMAIL ENTRY
    ══════════════════════════════════ -->
    <div id="email-view">
      <div class="auth-header">
        <span class="auth-icon">🎓</span>
        <h1 class="auth-title">AttendIQ Signup</h1>
        <p class="auth-subtitle">Verify your email to get started</p>
        <p class="auth-hint">We'll send a 6-digit code to confirm it's you.</p>
      </div>

      <p class="form-error" id="email-error"></p>

      <div class="field">
        <label class="field-label" for="email-input">Email</label>
        <div class="field-wrap">
          <span class="field-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input type="email" id="email-input" class="field-input" placeholder="Enter your email" autocomplete="email">
        </div>
      </div>

      <button class="btn btn-primary" id="btn-send-otp">
        <span class="btn-txt">Send OTP</span>
        <div class="spinner"></div>
      </button>

      <p class="link-row">Already have an account? <a href="../login/">Log in</a></p>
    </div><!-- /email-view -->

    <!-- ══════════════════════════════════
         STEP 2 — OTP VERIFICATION
    ══════════════════════════════════ -->
    <div id="otp-view" class="hidden">
      <div class="auth-header">
        <span class="auth-icon">📩</span>
        <h1 class="auth-title">AttendIQ Signup</h1>
        <p class="auth-subtitle">Enter verification code</p>
        <p class="auth-hint" id="otp-email-info"></p>
      </div>

      <p class="form-error" id="otp-error"></p>

      <div class="field">
        <label class="field-label" for="otp-input">OTP</label>
        <div class="field-wrap">
          <input type="text" id="otp-input" class="field-input otp-input" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter 6-digit OTP">
        </div>
      </div>

      <button class="btn btn-primary" id="btn-verify-otp">
        <span class="btn-txt">Verify OTP</span>
        <div class="spinner"></div>
      </button>

      <button class="btn btn-secondary" id="btn-resend-otp" disabled>
        <span class="btn-txt">Resend OTP</span>
        <div class="spinner"></div>
      </button>

      <p class="otp-timer" id="otp-timer">OTP expires in 05:00</p>
    </div><!-- /otp-view -->

  </div>
</div>

<div id="toasts"></div>

<script>
/* ════════════════════════════════════════════════════════════
   AttendIQ — signup/index.html
   Email entry + OTP verification, all on this one page (no
   separate otp.html). On success, stores the verified email in
   sessionStorage and redirects to ./details.html.
   ════════════════════════════════════════════════════════════ */

// ── Your OTP backend's Apps Script Web App URL (must end in /exec) ──
// This is the SEPARATE deployment for Code.gs (sendSignupOtp / verifySignupOtp).
const OTP_API_URL = "https://script.google.com/macros/s/AKfycbwIvs4xX7l1ueyd8b9tKE7mAraSPjdHTmjQApXJPrr1FiQIilj5P0d0tr9AxrLjCJmyHw/exec";

let currentEmail = "";
let expiryInterval = null;
let resendCooldownInterval = null;

const RESEND_COOLDOWN_SECONDS = 30; // anti-spam delay before Resend is enabled
const OTP_VALID_SECONDS = 5 * 60;   // must match backend's 5-minute expiry

async function callAPI(data) {
  const res = await fetch(OTP_API_URL, {
    method: "POST",
    // text/plain avoids a CORS preflight; Code.gs still parses
    // e.postData.contents as JSON.
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return await res.json();
}

function showView(id) {
  document.getElementById("email-view").classList.toggle("hidden", id !== "email-view");
  document.getElementById("otp-view").classList.toggle("hidden", id !== "otp-view");
}

function setErr(id, text) {
  document.getElementById(id).textContent = text || "";
}

function setLoad(btn, on) {
  btn.classList.toggle("loading", on);
  btn.disabled = on;
}

function toast(msg, type = "success") {
  const tc = document.getElementById("toasts");
  const t = document.createElement("div");
  t.className = "toast " + type;
  t.textContent = msg;
  tc.appendChild(t);
  setTimeout(() => { t.classList.add("out"); setTimeout(() => t.remove(), 350); }, 3200);
}

/* ── STEP 1: SEND OTP ─────────────────────────────────────── */
const emailInput = document.getElementById("email-input");
document.getElementById("btn-send-otp").addEventListener("click", sendOTP);
emailInput.addEventListener("keydown", e => { if (e.key === "Enter") sendOTP(); });

const emailRe = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

async function sendOTP() {
  const email = emailInput.value.trim();
  setErr("email-error", "");

  if (!email || !emailRe.test(email)) {
    setErr("email-error", "Please enter a valid email address.");
    return;
  }

  const btn = document.getElementById("btn-send-otp");
  setLoad(btn, true);

  try {
    const result = await callAPI({ action: "sendSignupOtp", email });
    setLoad(btn, false);

    if (result.success) {
      currentEmail = email;
      document.getElementById("otp-email-info").textContent = "OTP sent to " + email;
      document.getElementById("otp-input").value = "";
      setErr("otp-error", "");
      showView("otp-view");
      document.getElementById("otp-input").focus();
      startExpiryCountdown(OTP_VALID_SECONDS);
      startResendCooldown(RESEND_COOLDOWN_SECONDS);
      toast("OTP sent successfully.", "success");
    } else {
      setErr("email-error", result.message || "Could not send OTP.");
      toast(result.message || "Could not send OTP.", "err");
    }
  } catch (err) {
    console.error(err);
    setLoad(btn, false);
    setErr("email-error", "Network error. Please check your connection and try again.");
  }
}

/* ── STEP 2: VERIFY / RESEND OTP ─────────────────────────────── */
const otpInput = document.getElementById("otp-input");

otpInput.addEventListener("input", function () {
  this.value = this.value.replace(/\D/g, "").slice(0, 6);
});
otpInput.addEventListener("keydown", e => { if (e.key === "Enter") verifyOTP(); });

document.getElementById("btn-verify-otp").addEventListener("click", verifyOTP);
document.getElementById("btn-resend-otp").addEventListener("click", resendOTP);

async function verifyOTP() {
  const otp = otpInput.value.trim();
  setErr("otp-error", "");

  if (!/^\d{6}$/.test(otp)) {
    setErr("otp-error", "Enter a valid 6-digit OTP.");
    return;
  }

  const btn = document.getElementById("btn-verify-otp");
  setLoad(btn, true);

  try {
    const result = await callAPI({ action: "verifySignupOtp", email: currentEmail, otp });
    setLoad(btn, false);

    if (result.success) {
      clearInterval(expiryInterval);
      clearInterval(resendCooldownInterval);

      try {
        sessionStorage.setItem("attendiq_verified_email", currentEmail);
        // Signed by Code.gs (HMAC, no shared storage needed) so the
        // separate DetailsCode.gs backend can confirm this email was
        // actually verified, without a shared OTP sheet between them.
        sessionStorage.setItem("attendiq_verification_token", result.token || "");
      } catch (storageError) {
        console.error("sessionStorage unavailable:", storageError);
      }

      toast("Email verified successfully.", "success");
      setTimeout(() => { window.location.href = "./details.html"; }, 600);
    } else {
      setErr("otp-error", result.message || "Invalid OTP.");
      toast(result.message || "Invalid OTP.", "err");
    }
  } catch (err) {
    console.error(err);
    setLoad(btn, false);
    setErr("otp-error", "Network error. Please try again.");
  }
}

async function resendOTP() {
  const btn = document.getElementById("btn-resend-otp");
  setErr("otp-error", "");
  setLoad(btn, true);

  try {
    // Resend uses the same sendSignupOtp action — the backend
    // overwrites the previous OTP for this email so the old
    // code stops working as soon as a new one is issued.
    const result = await callAPI({ action: "sendSignupOtp", email: currentEmail });
    setLoad(btn, false);

    if (result.success) {
      otpInput.value = "";
      toast("A new OTP has been sent.", "success");
      startExpiryCountdown(OTP_VALID_SECONDS);
      startResendCooldown(RESEND_COOLDOWN_SECONDS);
    } else {
      setErr("otp-error", result.message || "Could not resend OTP.");
      toast(result.message || "Could not resend OTP.", "err");
      btn.disabled = false;
    }
  } catch (err) {
    console.error(err);
    setLoad(btn, false);
    setErr("otp-error", "Network error. Please try again.");
  }
}

/* ── COUNTDOWN: overall 5-minute OTP validity ─────────────────── */
function startExpiryCountdown(totalSeconds) {
  clearInterval(expiryInterval);
  let remaining = totalSeconds;
  const timerEl = document.getElementById("otp-timer");
  const verifyBtn = document.getElementById("btn-verify-otp");

  timerEl.classList.remove("warn", "expired");
  verifyBtn.disabled = false;

  function render() {
    const m = Math.floor(remaining / 60).toString().padStart(2, "0");
    const s = (remaining % 60).toString().padStart(2, "0");
    timerEl.textContent = "OTP expires in " + m + ":" + s;
    if (remaining <= 30) timerEl.classList.add("warn");
  }
  render();

  expiryInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(expiryInterval);
      timerEl.classList.remove("warn");
      timerEl.classList.add("expired");
      timerEl.textContent = "OTP expired — please resend.";
      verifyBtn.disabled = true;
      setErr("otp-error", "OTP expired. Tap Resend OTP to get a new code.");
    } else {
      render();
    }
  }, 1000);
}

/* ── COOLDOWN: how long before Resend OTP becomes clickable ───── */
function startResendCooldown(seconds) {
  clearInterval(resendCooldownInterval);
  let remaining = seconds;
  const btn = document.getElementById("btn-resend-otp");
  const label = btn.querySelector(".btn-txt");

  btn.disabled = true;
  label.textContent = "Resend OTP (" + remaining + "s)";

  resendCooldownInterval = setInterval(() => {
    remaining--;
    if (remaining <= 0) {
      clearInterval(resendCooldownInterval);
      btn.disabled = false;
      label.textContent = "Resend OTP";
    } else {
      label.textContent = "Resend OTP (" + remaining + "s)";
    }
  }, 1000);
}

showView("email-view");
</script>
</body>
</html>
